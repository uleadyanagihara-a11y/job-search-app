map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://laravel.test:80;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# 新旧共存期間（Phase 3–4）だけの新 SPA preview 入口（http://localhost:8081）。
# 通常画面と HMR WebSocket は Vite へ、API/CSRF/callback/storage/healthcheck は Laravel へ送る。
# Phase 5 で 80 側をこの構成に切り替えたら、この server ごと削除する。
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    # upstream 名を request 時に Docker の DNS で解決する。frontend が未起動でも nginx 自体
    # （80 側の旧アプリ）は起動でき、8081 だけが 502 になる。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $laravel_upstream http://laravel.test:80;
    set $frontend_upstream http://frontend:5173;

    proxy_http_version 1.1;

    # Host はブラウザが送った値（localhost:8081）をそのまま渡す。Vite は Host を検査し
    # （allowedHosts）、localhost 以外の名前（frontend:5173 等）だと 403 を返す。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Laravel の担当 path。SPA fallback（location /）より優先させるため ^~ を付ける。
    location ^~ /api/ {
        proxy_pass $laravel_upstream;
    }

    location ^~ /sanctum/ {
        proxy_pass $laravel_upstream;
    }

    location ^~ /auth/email/verify/ {
        proxy_pass $laravel_upstream;
    }

    location ^~ /storage/ {
        proxy_pass $laravel_upstream;
    }

    location = /up {
        proxy_pass $laravel_upstream;
    }

    # それ以外（HTML、/@vite/*、/src/*、HMR WebSocket、SPA route）は Vite へ。
    location / {
        proxy_pass $frontend_upstream;
        proxy_buffering off;
    }
}
