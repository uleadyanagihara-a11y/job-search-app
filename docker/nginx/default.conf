map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# development の唯一のブラウザ入口（http://localhost:${APP_PORT}）。
# 通常画面と HMR WebSocket は Vite へ、API/CSRF/callback/storage/healthcheck は Laravel へ送る。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # upstream 名を request 時に Docker の DNS で解決する。frontend が未起動でも nginx 自体は
    # 起動でき、API 系はそのまま動く（画面だけ 502 になる）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    # LARAVEL_UPSTREAM は compose.yaml で渡す（nginx は laravel.test:80、E2E 用の nginx-e2e は laravel.e2e:80）。
    # このファイルは nginx image の templates として mount され、起動時に envsubst で置換される
    # （置換されるのは定義済みの環境変数だけで、$http_host 等の nginx 変数はそのまま残る）。
    set $laravel_upstream http://${LARAVEL_UPSTREAM};
    set $frontend_upstream http://frontend:5173;

    proxy_http_version 1.1;

    # Host はブラウザが送った値（localhost:8080）をそのまま渡す。Vite は Host を検査し
    # （allowedHosts）、localhost 以外の名前（frontend:5173 等）だと 403 を返す。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Laravel の担当 path。SPA fallback（location /）より優先させるため ^~ を付ける。
    location ^~ /api/ {
        proxy_pass $laravel_upstream;
    }

    location ^~ /sanctum/ {
        proxy_pass $laravel_upstream;
    }

    location ^~ /auth/email/verify/ {
        proxy_pass $laravel_upstream;
    }

    location ^~ /storage/ {
        proxy_pass $laravel_upstream;
    }

    location = /up {
        proxy_pass $laravel_upstream;
    }

    # それ以外（HTML、/@vite/*、/src/*、HMR WebSocket、SPA route）は Vite へ。
    location / {
        proxy_pass $frontend_upstream;
        proxy_buffering off;
    }
}
