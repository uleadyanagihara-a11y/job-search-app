name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # setup-php は 8.5 系の最新を入れるが、パッチ版は固定できないため下限を検査する。
  # PHP 本体のセキュリティリリースが出たら、ローカルの Sail イメージ再ビルドと合わせてここを上げる。
  PHP_MIN_VERSION: '8.5.12'

# runs-on は ubuntu-latest ではなく版を固定する（ubuntu-latest は GitHub 側の都合で OS が切り替わるため）。
# runs-on では env を参照できないので、上げるときは各 job の runs-on をまとめて変える。
jobs:
  pint:
    name: Pint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Verify PHP version
        run: |
          php -r 'echo "php ", PHP_VERSION, " (minimum ", getenv("PHP_MIN_VERSION"), ")", PHP_EOL;'
          php -r 'exit(version_compare(PHP_VERSION, getenv("PHP_MIN_VERSION"), ">=") ? 0 : 1);'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: ./vendor/bin/pint --test

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # composer.lock だけを見るので vendor/ は不要。
      # 新しい advisory が公開されると、コードを変えていなくても落ちる（意図どおり）。
      - name: Composer audit
        run: composer audit --locked --no-interaction

  test:
    name: Laravel tests (MySQL)
    runs-on: ubuntu-26.04
    env:
      # ローカル（.env.example / CLAUDE.md）と同じ値に揃える
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost:8080
      APP_TIMEZONE: Asia/Tokyo
      SANCTUM_STATEFUL_DOMAINS: localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_0900_ai_ci
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    services:
      # RedisVerificationTest が実際の Redis に接続する（compose.yaml と同じタグ）
      redis:
        image: redis:8.10.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # services: では mysqld の起動フラグを渡せないため docker run で起動する。
      # compose.yaml の mysql command と同じ文字コード・照合順序・タイムゾーン。
      - name: Start MySQL 8.4
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=password \
            -e MYSQL_DATABASE=testing \
            -e MYSQL_USER=sail \
            -e MYSQL_PASSWORD=password \
            mysql:8.4.11 \
            --default-time-zone=+09:00 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_0900_ai_ci
          for i in $(seq 1 60); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent && exit 0
            sleep 2
          done
          docker logs mysql
          exit 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, redis
          coverage: none

      - name: Verify PHP version
        run: |
          php -r 'echo "php ", PHP_VERSION, " (minimum ", getenv("PHP_MIN_VERSION"), ")", PHP_EOL;'
          php -r 'exit(version_compare(PHP_VERSION, getenv("PHP_MIN_VERSION"), ">=") ? 0 : 1);'

      # .env が無いと phpdotenv の読み込み失敗が php artisan test でテストごとの warning として出る。
      # 設定値は上の env で渡すため、中身は空でよい（.env.example をコピーすると env 以外の値が混ざる）。
      - name: Create empty .env
        run: touch .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests
        run: php artisan test

  frontend:
    name: Frontend (frontend/)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # compose.yaml の frontend service（node:${NODE_VERSION}-bookworm-slim）と同じ Node
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Node は .env.example の NODE_VERSION、npm は package.json の packageManager と一致させる
      - name: Verify Node/npm versions
        run: |
          expected_node="$(sed -n 's/^NODE_VERSION=//p' ../.env.example)"
          expected_npm="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          echo "node $(node --version) (expected v${expected_node})"
          echo "npm $(npm --version) (expected ${expected_npm})"
          test "$(node --version)" = "v${expected_node}"
          test "$(npm --version)" = "${expected_npm}"

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          ls dist/assets/*.js
