name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: ./vendor/bin/pint --test

  test:
    name: Laravel tests (MySQL)
    runs-on: ubuntu-latest
    env:
      # ローカル（.env.example / CLAUDE.md）と同じ値に揃える
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost:8080
      APP_TIMEZONE: Asia/Tokyo
      SANCTUM_STATEFUL_DOMAINS: localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_0900_ai_ci
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    services:
      # RedisVerificationTest が実際の Redis に接続する（compose.yaml と同じタグ）
      redis:
        image: redis:8.10.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # services: では mysqld の起動フラグを渡せないため docker run で起動する。
      # compose.yaml の mysql command と同じ文字コード・照合順序・タイムゾーン。
      - name: Start MySQL 8.4
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=password \
            -e MYSQL_DATABASE=testing \
            -e MYSQL_USER=sail \
            -e MYSQL_PASSWORD=password \
            mysql:8.4.11 \
            --default-time-zone=+09:00 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_0900_ai_ci
          for i in $(seq 1 60); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent && exit 0
            sleep 2
          done
          docker logs mysql
          exit 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Inertia の画面を描画するテストが public/build/manifest.json を必要とする
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Tests
        run: php artisan test

  build:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # resources/js/app.js が vendor/tightenco/ziggy を import するため vendor が必要
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npm run build
