name: CI

# PR のコード（fork・Dependabot を含む）は信頼しない前提で動かす。
# - pull_request_target は使わない（PR のコードを base の権限・secrets で動かさないため）。
# - token は contents: read だけにし、checkout の認証情報も残さない（persist-credentials: false）。
# - secrets を参照しない。job ごとに timeout-minutes を付け、無制限に実行させない。
# - 外部からの PR の実行承認は GitHub の設定（docs/accepted-vulnerabilities.md の「CI の実行制限」）で行う。
on:
  push:
    branches: [main]
  pull_request:
  # コードを変えなくても、新しい advisory や修正版の公開を audit で検出する（Dependabot と同じ月曜 9:00 JST）
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # setup-php は 8.5 系の最新を入れるが、パッチ版は固定できないため下限を検査する。
  # PHP 本体のセキュリティリリースが出たら、ローカルの Sail イメージ再ビルドと合わせてここを上げる。
  PHP_MIN_VERSION: '8.5.12'

# runs-on は ubuntu-latest ではなく版を固定する（ubuntu-latest は GitHub 側の都合で OS が切り替わるため）。
# runs-on では env を参照できないので、上げるときは各 job の runs-on をまとめて変える。
jobs:
  pint:
    name: Pint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Verify PHP version
        run: |
          php -r 'echo "php ", PHP_VERSION, " (minimum ", getenv("PHP_MIN_VERSION"), ")", PHP_EOL;'
          php -r 'exit(version_compare(PHP_VERSION, getenv("PHP_MIN_VERSION"), ">=") ? 0 : 1);'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: ./vendor/bin/pint --test

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # composer.lock だけを見るので vendor/ は不要。
      # 新しい advisory が公開されると、コードを変えていなくても落ちる（意図どおり）。
      - name: Composer audit
        run: composer audit --locked --no-interaction

  npm-audit:
    name: npm audit (frontend/)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'

      # package-lock.json だけを見るので node_modules は不要（npm ci しない＝依存の install script も動かない）。
      # 許容済みの advisory（audit-accepted.json）以外が出たとき、修正版が公開されたときに落ちる。
      # 理由と再評価の手順は docs/accepted-vulnerabilities.md。
      - name: npm audit
        run: npm run audit:check

  test:
    name: Laravel tests (MySQL)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # ローカル（.env.example / CLAUDE.md）と同じ値に揃える
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost:8080
      APP_TIMEZONE: Asia/Tokyo
      APP_LOCALE: ja
      APP_FALLBACK_LOCALE: ja
      APP_FAKER_LOCALE: ja_JP
      SANCTUM_STATEFUL_DOMAINS: localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_0900_ai_ci
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    services:
      # RedisVerificationTest が実際の Redis に接続する（compose.yaml と同じタグ）
      redis:
        image: redis:8.10.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # services: では mysqld の起動フラグを渡せないため docker run で起動する。
      # compose.yaml の mysql command と同じ文字コード・照合順序・タイムゾーン。
      - name: Start MySQL 8.4
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=password \
            -e MYSQL_DATABASE=testing \
            -e MYSQL_USER=sail \
            -e MYSQL_PASSWORD=password \
            mysql:8.4.11 \
            --default-time-zone=+09:00 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_0900_ai_ci
          for i in $(seq 1 60); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent && exit 0
            sleep 2
          done
          docker logs mysql
          exit 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, redis
          coverage: none

      - name: Verify PHP version
        run: |
          php -r 'echo "php ", PHP_VERSION, " (minimum ", getenv("PHP_MIN_VERSION"), ")", PHP_EOL;'
          php -r 'exit(version_compare(PHP_VERSION, getenv("PHP_MIN_VERSION"), ">=") ? 0 : 1);'

      # .env が無いと phpdotenv の読み込み失敗が php artisan test でテストごとの warning として出る。
      # 設定値は上の env で渡すため、中身は空でよい（.env.example をコピーすると env 以外の値が混ざる）。
      - name: Create empty .env
        run: touch .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests
        run: php artisan test

  frontend:
    name: Frontend (frontend/)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # compose.yaml の frontend service（node:${NODE_VERSION}-bookworm-slim）と同じ Node
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Node は .env.example の NODE_VERSION、npm は package.json の packageManager と一致させる
      - name: Verify Node/npm versions
        run: |
          expected_node="$(sed -n 's/^NODE_VERSION=//p' ../.env.example)"
          expected_npm="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          echo "node $(node --version) (expected v${expected_node})"
          echo "npm $(npm --version) (expected ${expected_npm})"
          test "$(node --version)" = "v${expected_node}"
          test "$(npm --version)" = "${expected_npm}"

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # unit/component/router（Vitest）。E2E（Playwright）は e2e job。
      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          ls dist/assets/*.js

  # ローカルと同じ Compose の test profile（laravel.e2e / nginx-e2e / frontend-e2e）で Playwright を動かす。
  # Nginx の振り分けを含めて検査するため、ホストで artisan serve / Vite を動かす形にはしない。
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Dependabot は Playwright を ignore しているので、compose.yaml の image tag と lock の version のずれをここで検出する
      - name: Verify Playwright versions
        run: |
          lock="$(jq -r '.packages["node_modules/@playwright/test"].version' frontend/package-lock.json)"
          image="$(sed -n 's#.*mcr\.microsoft\.com/playwright:v\([0-9.]*\)-.*#\1#p' compose.yaml)"
          echo "@playwright/test ${lock} / image v${image}"
          test -n "${lock}"
          test "${lock}" = "${image}"

      # Sail の Dockerfile は vendor/laravel/sail にあるため、image の build より先に入れる
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # laravel.e2e と mysql は .env を読む（ローカルの開発環境を再現するため .env.example を使う）。
      # bind mount へ書き込めるよう、container の uid を runner（1001）に合わせる（shell の環境変数は .env より優先される）。
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s#^APP_KEY=.*#APP_KEY=base64:$(openssl rand -base64 32)#" .env
          echo "WWWUSER=$(id -u)" >> "$GITHUB_ENV"
          echo "WWWGROUP=$(id -g)" >> "$GITHUB_ENV"

      # Sail の Dockerfile は apt で大量に入れるため、cache なしだと 15 分かかる。GitHub Actions の cache に layer を残す。
      # - cache に書くのは main への push と schedule だけ（PR は main の cache を読むだけにし、PR ごとの 3GB で容量を埋めない）。
      # - Dockerfile が変わらない限り apt の upgrade も cache のままになるため、週次の schedule では cache を使わずに作り直す。
      # - tag は compose.yaml の laravel.test / laravel.e2e と同じ。image があれば compose は build しない。
      - uses: docker/setup-buildx-action@v4

      - name: Build Sail image
        uses: docker/build-push-action@v7
        with:
          context: vendor/laravel/sail/runtimes/8.5
          build-args: WWWGROUP=${{ env.WWWGROUP }}
          tags: sail-8.5/app
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=sail-8.5
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=sail-8.5' || '' }}

      # frontend-e2e は npm ci をせず ./frontend/node_modules を使う
      - name: Install npm dependencies
        run: docker compose run --rm --no-deps frontend npm ci

      # 依存（mysql / redis / mailpit / laravel.e2e / frontend / nginx-e2e）も起動する
      - name: E2E
        run: docker compose run --rm frontend-e2e

      - name: Container logs
        if: failure()
        run: docker compose --profile test logs --no-color laravel.e2e nginx-e2e frontend mysql

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
