services:
    nginx:
        image: 'nginx:${NGINX_VERSION:-1.28.0-alpine}'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            LARAVEL_UPSTREAM: 'laravel.test:80'
        volumes:
            # templates/*.template は起動時に envsubst されて conf.d/ に出力される（LARAVEL_UPSTREAM の置換）
            - './docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/up']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        expose:
            - '80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', '--show-error', 'http://127.0.0.1/up']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
    # 新 SPA（frontend/）の Vite。host へは port を公開せず、Docker network 内の frontend:5173 だけで待ち受ける。
    # node_modules は ./frontend/node_modules に bind mount され、ホストの VSCode から型を解決できる。
    # 初回や lock 更新後は docker compose run --rm --no-deps frontend npm ci で依存を入れてから起動する
    # （sail run は laravel.test 内で実行されるため使えない）。
    frontend:
        image: 'node:${NODE_VERSION:-24.22.0}-bookworm-slim'
        user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
        working_dir: /app
        # host/port は vite.config.ts にもあるが、branch 切替等で config が一時的に消えて Vite が
        # 自動再起動しても localhost 待ち受けに戻らないよう、CLI でも固定する。
        command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0', '--port', '5173', '--strictPort']
        expose:
            - '5173'
        volumes:
            - './frontend:/app'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
    # --- E2E（test profile）: docker compose run --rm frontend-e2e npm run test:e2e ---
    # 開発データを更新しないよう、専用 DB（testing_e2e）を使う Laravel と、それを向く Nginx を別に立てる。
    # Vite は開発用の frontend service を共有する。sail up / docker compose up では起動しない。
    laravel.e2e:
        image: 'sail-8.5/app'
        profiles: ['test']
        expose:
            - '80'
        # .env より compose の environment が優先される（Laravel の dotenv は既存の環境変数を上書きしない）。
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: 'off'
            # testing_e2e は create-testing-database.sh の GRANT（testing%）の範囲。無ければ migrate が作る
            DB_DATABASE: testing_e2e
            # ブラウザは nginx-e2e の network namespace から http://localhost で開く
            APP_URL: 'http://localhost'
            FRONTEND_URL: 'http://localhost'
            SANCTUM_STATEFUL_DOMAINS: localhost
            # 開発側で config:cache していても、その（開発 DB を向いた）cache を読まない
            APP_CONFIG_CACHE: /tmp/laravel-e2e-config.php
        # 起動のたびに testing_e2e を作り直す。artisan serve は --no-reload を付けないと
        # .env にある key の環境変数を外して子 process を起動し、DB_DATABASE が .env の値（開発 DB）に戻る。
        command:
            - sh
            - -c
            - 'php artisan migrate:fresh --force && exec php -d variables_order=EGPCS artisan serve --host=0.0.0.0 --port=80 --no-reload'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', '--show-error', 'http://127.0.0.1/up']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s
    nginx-e2e:
        image: 'nginx:${NGINX_VERSION:-1.28.0-alpine}'
        profiles: ['test']
        # host へは公開しない。frontend-e2e がこの container の network namespace から localhost:80 で使う
        environment:
            LARAVEL_UPSTREAM: 'laravel.e2e:80'
        volumes:
            - './docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro'
        networks:
            - sail
        depends_on:
            laravel.e2e:
                condition: service_healthy
            frontend:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/up']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
    # Playwright（browser 同梱）。tag は frontend/package.json の @playwright/test と同じ version にする。
    # npm ci はせず、frontend service で入れた ./frontend/node_modules をそのまま使う。
    frontend-e2e:
        image: 'mcr.microsoft.com/playwright:v1.64.1-noble'
        profiles: ['test']
        user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
        working_dir: /app
        init: true
        # Nginx の入口を http://localhost にする（Vite の allowedHosts と Sanctum の stateful domain に一致させる）
        network_mode: 'service:nginx-e2e'
        environment:
            HOME: /tmp
            E2E_BASE_URL: 'http://localhost'
            CI: '${CI:-}'
        command: ['npm', 'run', 'test:e2e']
        volumes:
            - './frontend:/app'
        depends_on:
            nginx-e2e:
                condition: service_healthy
    mysql:
        image: 'mysql:${MYSQL_VERSION:-8.4.11}'
        # サーバ起動フラグ。永続ボリュームの有無に関係なく毎回適用される
        # （initdb スクリプトと違い datadir 初期化とは無関係）。
        # 変更を反映するにはコンテナ再作成（./vendor/bin/sail up -d）が必要。restart では不可。
        command:
            - '--default-time-zone=+09:00'
            - '--character-set-server=utf8mb4'
            - '--collation-server=utf8mb4_0900_ai_ci'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysqladmin ping --host=127.0.0.1 --user="$${MYSQL_USER}" --silent']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 30s
    redis:
        image: 'redis:${REDIS_VERSION:-8.10.0-alpine}'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
    mailpit:
        image: 'axllent/mailpit:${MAILPIT_VERSION:-v1.30.6}'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        environment:
            MP_DATABASE: /data/mailpit.db
        volumes:
            - 'sail-mailpit:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', '/mailpit', 'readyz']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-mailpit:
        driver: local
