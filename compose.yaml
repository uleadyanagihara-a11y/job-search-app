services:
    nginx:
        image: 'nginx:${NGINX_VERSION:-1.28.0-alpine}'
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/up']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        expose:
            - '80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', '--show-error', 'http://127.0.0.1/up']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
    # 新 SPA（frontend/）の Vite。host へは port を公開せず、Docker network 内の frontend:5173 だけで待ち受ける。
    # node_modules は ./frontend/node_modules に bind mount され、ホストの VSCode から型を解決できる。
    # 初回や lock 更新後は docker compose run --rm --no-deps frontend npm ci で依存を入れてから起動する
    # （sail run は laravel.test 内で実行されるため使えない）。
    frontend:
        image: 'node:${NODE_VERSION:-24.22.0}-bookworm-slim'
        user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
        working_dir: /app
        # host/port は vite.config.ts にもあるが、branch 切替等で config が一時的に消えて Vite が
        # 自動再起動しても localhost 待ち受けに戻らないよう、CLI でも固定する。
        command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0', '--port', '5173', '--strictPort']
        expose:
            - '5173'
        volumes:
            - './frontend:/app'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
    mysql:
        image: 'mysql:${MYSQL_VERSION:-8.4.11}'
        # サーバ起動フラグ。永続ボリュームの有無に関係なく毎回適用される
        # （initdb スクリプトと違い datadir 初期化とは無関係）。
        # 変更を反映するにはコンテナ再作成（./vendor/bin/sail up -d）が必要。restart では不可。
        command:
            - '--default-time-zone=+09:00'
            - '--character-set-server=utf8mb4'
            - '--collation-server=utf8mb4_0900_ai_ci'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysqladmin ping --host=127.0.0.1 --user="$${MYSQL_USER}" --silent']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 30s
    redis:
        image: 'redis:${REDIS_VERSION:-8.10.0-alpine}'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
    mailpit:
        image: 'axllent/mailpit:${MAILPIT_VERSION:-v1.30.6}'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        environment:
            MP_DATABASE: /data/mailpit.db
        volumes:
            - 'sail-mailpit:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', '/mailpit', 'readyz']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-mailpit:
        driver: local
